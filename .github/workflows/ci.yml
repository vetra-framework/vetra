name: Compilador da IR

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake test
      - name: graph:check em todos os exemplos
        run: |
          for app in examples/*/; do
            bundle exec bin/vetra graph:check --root "${app%/}"
          done
      - name: graph:validate em todos os exemplos
        run: |
          for app in examples/*/; do
            bundle exec bin/vetra graph:validate --root "${app%/}" --sources
          done
      - name: Diff arquitetural contra a base do PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Descobre os grafos na BASE, não no PR: um artefato removido ou uma pasta apagada não pode
          # escapar da comparação. Exemplos novos (sem versão na base) passam só pelos checks normais.
          base="origin/$BASE_REF"
          status=0
          while IFS= read -r path; do
            app="${path%/.vetra/graph.json}"
            [ "$app" = "$path" ] && app=.
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Artefato removido: $path existe em $base e não existe neste PR"
              status=1
              continue
            fi
            echo "graph:diff $app contra $base"
            bundle exec bin/vetra graph:diff "git:$base" "$path" --root "$app" --format json --fail-on-breaking || status=1
          done < <(git ls-tree -r --name-only "$base" | grep -E '(^|/)\.vetra/graph\.json$' || true)
          exit "$status"
      - name: graph:link em todos os exemplos
        run: |
          for app in examples/*/; do
            bundle exec bin/vetra graph:link --root "${app%/}"
          done

  postgres:
    name: sondas (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
      - run: ruby script/sonda_adr002.rb
      - run: ruby script/sonda_adr003.rb
      - run: ruby script/sonda_adr009.rb
      - run: ruby script/sonda_adr015.rb
      - run: ruby script/sonda_adr019.rb
