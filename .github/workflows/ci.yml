name: Compilador da IR

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Testes e cobertura dos códigos de diagnóstico
        run: bundle exec rake test:diagnostics
      - name: graph:check em todos os exemplos
        run: |
          for app in examples/*/; do
            bundle exec bin/vetra graph:check --root "${app%/}"
          done
      - name: graph:validate em todos os exemplos
        run: |
          for app in examples/*/; do
            bundle exec bin/vetra graph:validate --root "${app%/}" --sources
          done
      - name: Diff arquitetural contra a base do evento
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::O evento não forneceu um SHA de base válido"
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            bundle exec ruby script/check_graph_compatibility.rb --base "$BASE_SHA" --initial-push
          else
            # Um force-push pode retirar a base da história alcançável pelo checkout.
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA"
            fi
            bundle exec ruby script/check_graph_compatibility.rb --base "$BASE_SHA"
          fi
      - name: graph:link em todos os exemplos
        run: |
          for app in examples/*/; do
            bundle exec bin/vetra graph:link --root "${app%/}"
          done

  postgres:
    name: sondas (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
      - run: ruby script/sonda_adr002.rb
      - run: ruby script/sonda_adr003.rb
      - run: ruby script/sonda_adr008.rb
      - run: ruby script/sonda_adr009.rb
      - run: ruby script/sonda_adr011.rb
      - run: ruby script/sonda_adr015.rb
      - run: ruby script/sonda_adr019.rb
      - run: ruby script/sonda_adr020.rb
      - run: ruby script/sonda_adr031.rb

  db-plan:
    name: db:plan (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      VETRA_PG_DUMP: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_dump
      # Senha só deste servidor descartável: o db:plan --check entra como vetra_migrator (ADR-038, §3).
      VETRA_MIGRATOR_PASSWORD: vetra-migrator-ci
      # Idem para vetra_app: a sonda do Vetra Data conecta o pool do runtime como a aplicação (ADR-039).
      VETRA_APP_PASSWORD: vetra-app-ci
      # Idem para vetra_relay: a sonda do relay conecta o relay e a manutenção como esse papel (ADR-040, §3).
      VETRA_RELAY_PASSWORD: vetra-relay-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # O retrato só é reproduzível com o pg_dump da mesma versão principal do servidor.
      - name: Cliente do PostgreSQL ${{ matrix.postgres }}
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-${{ matrix.postgres }}
      - name: Bootstrap operacional dos papéis (idempotente, fora dos planos)
        run: |
          bundle exec ruby -Ilib -rvetra -rpg -e 'PG.connect(ENV.fetch("DATABASE_URL")) { |c| 2.times { c.exec(Vetra::SQL::Context.roles_sql) } }'
      - name: Senhas de login do vetra_migrator, do vetra_app e do vetra_relay neste servidor descartável
        run: |
          bundle exec ruby -rpg -e 'PG.connect(ENV.fetch("DATABASE_URL")) { |c| c.exec("ALTER ROLE vetra_migrator PASSWORD #{c.escape_literal(ENV.fetch("VETRA_MIGRATOR_PASSWORD"))}"); c.exec("ALTER ROLE vetra_app PASSWORD #{c.escape_literal(ENV.fetch("VETRA_APP_PASSWORD"))}"); c.exec("ALTER ROLE vetra_relay PASSWORD #{c.escape_literal(ENV.fetch("VETRA_RELAY_PASSWORD"))}") }'
      # Bootstrap operacional do vetra_app (nunca em plano): a unidade recusa abrir sem estes tetos (ADR-016, C15).
      - name: Limites de transação do vetra_app neste servidor descartável
        run: |
          bundle exec ruby -rpg -e 'PG.connect(ENV.fetch("DATABASE_URL")) { |c| c.exec("ALTER ROLE vetra_app SET transaction_timeout = '"'"'30s'"'"'"); c.exec("ALTER ROLE vetra_app SET idle_in_transaction_session_timeout = '"'"'10s'"'"'") }'
      - name: Fundação do plano incremental como vetra_migrator
        run: bundle exec ruby script/sonda_plano_incremental.rb
      - name: Vetra Data, unidade de trabalho e contexto emitido em Ruby
        run: bundle exec ruby script/sonda_vetra_data.rb
      - name: Limites da unidade, estouros, SERIALIZABLE e proteção do xmin (ADR-016)
        run: bundle exec ruby script/sonda_limites_unidade.rb
      - name: Diferenças aditivas do plano incremental, com dados e escrita concorrente
        run: bundle exec ruby script/sonda_plano_aditivo.rb
      - name: Contexto assinado e privilégios do plano gerado
        run: bundle exec ruby script/sonda_contexto_assinado.rb
      - name: RLS, escopos, revisão e transições dos planos gerados
        run: bundle exec ruby script/sonda_rls_integridade.rb
      - name: db:migrate num banco real como vetra_migrator
        run: bundle exec ruby script/sonda_db_migrate.rb
      - name: db:migrate incremental, passo a passo, com quedas e retomada
        run: bundle exec ruby script/sonda_db_migrate_incremental.rb
      - name: Repositórios gerados e corpos dos exemplos contra o banco
        run: bundle exec ruby script/sonda_repositorios.rb
      - name: Outbox, armazenamento e emissão na unidade de trabalho
        run: bundle exec ruby script/sonda_outbox.rb
      - name: Relay, entregas e manutenção das partições da outbox
        run: bundle exec ruby script/sonda_relay.rb
      - name: Custo do contexto assinado e dos registros, medição informativa (ADR-023 e ADR-022)
        env:
          VETRA_MEDICAO_SEGUNDOS: '1.5'
          VETRA_MEDICAO_RODADAS: '2'
        run: bundle exec ruby script/sonda_custo_contexto.rb
      - name: Autorização Ruby e RLS concordam nos mesmos casos, sem abrir transação (ADR-044)
        run: bundle exec ruby script/sonda_autorizacao_ruby.rb
      - name: Autorização Ruby do chat contra o EXISTS equivalente em SQL, com many_to_many (ADR-044, C16)
        run: bundle exec ruby script/sonda_autorizacao_chat.rb
      - name: Runner, borda e primitivas dos três tipos de exemplo, com as duas contagens de transações (ADR-045)
        run: bundle exec ruby script/sonda_runner.rb
      - name: Autorização dos acessos, estado final e ator de sistema, com e sem RLS (ADR-046)
        run: bundle exec ruby script/sonda_acessos.rb
      - name: Fechamento do Runner, com eventos, idempotência, status e repetição por transações concorrentes (ADR-047)
        run: bundle exec ruby script/sonda_fechamento.rb
      - name: Registro de idempotência da operação, concorrência, privilégios e purga (ADR-043)
        run: bundle exec ruby script/sonda_idempotencia.rb
      - name: Escopo por vínculo, permissões por ação e custo informativo (ADR-041)
        env:
          VETRA_MEDICAO_SEGUNDOS: '0.3'
          VETRA_MEDICAO_RODADAS: '1'
          VETRA_ESCOPO_ATORES: gerente de 1
        run: bundle exec ruby script/sonda_escopo.rb
      - name: db:plan --check em todos os exemplos
        run: |
          for app in examples/*/; do
            bundle exec bin/vetra db:plan --check --root "${app%/}"
          done
